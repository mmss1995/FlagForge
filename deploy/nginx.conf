upstream flagforge {
  # Docker DNS resolves "api" to every replica; nginx round-robins across them.
  # SSE works on any replica because changes fan out through Redis pub/sub.
  server api:4000;
}

server {
  listen 80;

  location / {
    proxy_pass http://flagforge;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
  }

  # Server-Sent Events: no buffering, long-lived connections.
  location ~ ^/(sdk|api)/stream {
    proxy_pass http://flagforge;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
