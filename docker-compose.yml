# Full stack: Redis plus two FlagForge replicas behind nginx.
#   docker compose up --build
#   dashboard → http://localhost:4000   (admin token: dev-admin-token)
# Two replicas are deliberate: a change saved through one reaches SDKs streaming
# from the other via Redis pub/sub, so what you see here is the scaled setup.
name: flagforge

x-flagforge: &flagforge
  image: flagforge:local
  environment:
    REDIS_URL: redis://redis:6379
    ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    ENVIRONMENTS: development,staging,production
    SDK_KEYS: development=sdk-development-demo,production=sdk-production-demo
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *flagforge
    build: .
    deploy:
      replicas: 2

  gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '4000:80'
    depends_on:
      - api

  # One-off: docker compose run --rm seed
  seed:
    <<: *flagforge
    depends_on:
      - api
    command: ['node', 'seed.js']
    restart: 'no'
    profiles: ['tools']

volumes:
  redis-data:
